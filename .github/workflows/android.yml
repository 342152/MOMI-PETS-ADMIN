
name: MOMI PETS ADMIN APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MOMI PETS ADMIN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Check Android Project
        shell: bash
        run: |
          set -e
          echo "Checking Android project..."

          if [ ! -d "android-admin" ]; then
            echo "::error::android-admin folder not found"
            ls -la
            exit 1
          fi

          cd android-admin

          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle
          test -d app
          test -f app/build.gradle.kts || test -f app/build.gradle

          echo "Android project files found."

      - name: Locate Firebase Configuration
        shell: bash
        run: |
          set -e

          TARGET="android-admin/app/google-services.json"

          if [ -f "$TARGET" ]; then
            echo "Firebase file already exists at correct location."
          else
            echo "Searching repository for google-services.json..."

            SOURCE=$(find . -type f -name "google-services.json" \
              -not -path "./.git/*" | head -n 1)

            if [ -z "$SOURCE" ]; then
              echo "::error::google-services.json was not found anywhere in repository."
              exit 1
            fi

            mkdir -p android-admin/app
            cp "$SOURCE" "$TARGET"
            echo "Firebase file copied to Android app folder."
          fi

          python3 - <<'PY'
          import json
          path = "android-admin/app/google-services.json"
          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          project = data.get("project_info", {}).get("project_id")
          clients = data.get("client", [])

          expected_project = "thinking-country-mx6pd"
          expected_package = "com.momipets.admin"

          if project != expected_project:
              raise SystemExit(
                  f"Wrong Firebase project: {project}"
              )

          packages = [
              c.get("client_info", {})
               .get("android_client_info", {})
               .get("package_name")
              for c in clients
          ]

          if expected_package not in packages:
              raise SystemExit(
                  f"Package {expected_package} not found in Firebase file. Found: {packages}"
              )

          print("Firebase project and Android package verified.")
          PY

      - name: Build Debug APK
        working-directory: android-admin
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="android-admin/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated."
            find android-admin/app/build/outputs -type f || true
            exit 1
          fi

          echo "APK successfully generated."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOMI-PETS-ADMIN-APK
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
