
name: MOMI PETS ADMIN - APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK and Generate SHA1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Stable Debug Keystore
        run: |
          mkdir -p ~/.android

      - name: Restore Stable Debug Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: momi-pets-debug-keystore-v1

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Check Android Project
        working-directory: android-admin
        run: |
          set -e
          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle
          echo "Android project verified."

      - name: Verify Firebase Configuration
        run: |
          set -e
          FILE="android-admin/app/google-services.json"

          if [ ! -f "$FILE" ]; then
            echo "::error::google-services.json missing"
            exit 1
          fi

          python3 - <<'PY'
          import json

          path = "android-admin/app/google-services.json"

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          project = data["project_info"]["project_id"]

          packages = [
              c.get("client_info", {})
               .get("android_client_info", {})
               .get("package_name")
              for c in data.get("client", [])
          ]

          if project != "thinking-country-mx6pd":
              raise SystemExit("Wrong Firebase Project ID")

          if "com.momipets.admin" not in packages:
              raise SystemExit("Wrong Android Package Name")

          print("Firebase configuration verified.")
          PY

      - name: Build Debug APK
        working-directory: android-admin
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Generate SHA1 Fingerprint
        working-directory: android-admin
        run: |
          gradle --no-daemon signingReport | tee signing-report.txt

          echo "=================================="
          echo "MOMI PETS ADMIN DEBUG SHA1"
          echo "=================================="

          grep -A 8 "Variant: debug" signing-report.txt || true

          echo "Full report saved."

      - name: Upload SHA1 Report
        uses: actions/upload-artifact@v4
        with:
          name: MOMI-PETS-SHA1-REPORT
          path: android-admin/signing-report.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOMI-PETS-ADMIN-APK
          path: android-admin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
