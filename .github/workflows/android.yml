
name: MOMI PETS ADMIN - APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK and Generate SHA1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Restore Debug Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: momi-pets-debug-keystore-v1

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Check Android Project
        working-directory: android-admin
        run: |
          set -e
          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle
          echo "Android project verified."

      - name: Verify Firebase Configuration
        run: |
          set -e
          FILE="android-admin/app/google-services.json"

          if [ ! -f "$FILE" ]; then
            echo "::error::google-services.json is missing"
            exit 1
          fi

          python3 - <<'PY'
          import json
          import sys

          path = "android-admin/app/google-services.json"

          try:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
          except json.JSONDecodeError as e:
              print("FIREBASE JSON FILE IS INVALID")
              print(f"File: {path}")
              print(f"Error: {e.msg}")
              print(f"Line: {e.lineno}")
              print(f"Column: {e.colno}")
              print("Please replace this file with a fresh Firebase download.")
              sys.exit(1)

          try:
              project = data["project_info"]["project_id"]
              packages = [
                  c.get("client_info", {})
                   .get("android_client_info", {})
                   .get("package_name")
                  for c in data.get("client", [])
              ]
          except (KeyError, TypeError):
              print("Firebase JSON structure is incomplete.")
              sys.exit(1)

          if project != "thinking-country-mx6pd":
              print("Wrong Firebase Project ID:", project)
              sys.exit(1)

          if "com.momipets.admin" not in packages:
              print("Wrong Android package name.")
              print("Expected: com.momipets.admin")
              print("Found:", packages)
              sys.exit(1)

          print("Firebase JSON is valid.")
          print("Firebase Project:", project)
          print("Android Package: com.momipets.admin")
          PY

      - name: Build Debug APK
        working-directory: android-admin
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Generate SHA1 and SHA256
        working-directory: android-admin
        run: |
          set -e
          gradle --no-daemon signingReport | tee signing-report.txt

          echo "===================================="
          echo "MOMI PETS ADMIN FINGERPRINT REPORT"
          echo "===================================="

          grep -A 12 "Variant: debug" signing-report.txt || true

      - name: Upload SHA1 Report
        uses: actions/upload-artifact@v4
        with:
          name: MOMI-PETS-SHA1-REPORT
          path: android-admin/signing-report.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOMI-PETS-ADMIN-APK
          path: android-admin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
