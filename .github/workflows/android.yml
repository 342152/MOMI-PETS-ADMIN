
name: Build MOMI PETS ADMIN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Check Android Project
        working-directory: android-admin
        run: |
          set -e
          echo "Checking Android project files..."

          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle
          test -d app
          test -f app/build.gradle.kts || test -f app/build.gradle

          echo "Project files found."

      - name: Check Firebase File
        working-directory: android-admin
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json is missing"
            exit 1
          fi

          echo "Firebase configuration found."

      - name: Build Debug APK
        working-directory: android-admin
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          APK="android-admin/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "APK successfully generated."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOMI-PETS-ADMIN-APK
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
