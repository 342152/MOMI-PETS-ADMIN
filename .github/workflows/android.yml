**فائل کا نام:** `.github/workflows/android.yml`

```yaml
name: Build MOMI PETS ADMIN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download project source code
      - name: Checkout Repository
        uses: actions/checkout@v6

      # 2. Install Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # 4. Install Gradle 8.7
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      # 5. Check Android project files
      - name: Check Project Files
        working-directory: android-admin
        run: |
          echo "Checking Android project..."
          ls -la
          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle
          test -d app
          test -f app/build.gradle.kts || test -f app/build.gradle

      # 6. Check Firebase configuration
      - name: Check Firebase Configuration
        working-directory: android-admin
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "ERROR: app/google-services.json is missing."
            echo "Add the correct Firebase Android configuration file."
            exit 1
          fi
          echo "Firebase configuration found."

      # 7. Build Debug APK
      - name: Build MOMI PETS ADMIN
        working-directory: android-admin
        run: |
          gradle --no-daemon assembleDebug

      # 8. Upload APK
      - name: Upload MOMI PETS ADMIN APK
        uses: actions/upload-artifact@v4
        with:
          name: MOMI-PETS-ADMIN-APK
          path: android-admin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
```
